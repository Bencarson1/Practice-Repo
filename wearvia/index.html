<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wearvia</title>
  <meta name="description" content="Wearvia — design, order and track bespoke outfits. First shop: Nebeda Threads.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top bar: app name, first shop, and switch between customer app and business dashboard -->
  <header class="appbar">
    <a class="wordmark" href="#/home"><span id="app-name">Wearvia</span></a>
    <span class="shop-pill">First shop: <b id="shop-name">Nebeda Threads</b></span>
    <nav class="modes" aria-label="Switch view">
      <a id="mode-customer" href="#/home">Customer<span class="wide-only"> app</span></a>
      <a id="mode-seller" href="#/seller">Fabric seller<span class="wide-only">s</span></a>
      <a id="mode-business" href="#/biz/dashboard">Business<span class="wide-only"> dashboard</span></a>
    </nav>
  </header>

  <main>
    <!-- Customer app: phone-sized, follows the order steps one screen at a time -->
    <div id="customer-view" class="customer-view">
      <div id="customer-app" class="capp"></div>
    </div>

    <!-- Business dashboard: tabs for the shop's back office -->
    <div id="business-view" class="business-view" hidden>
      <nav id="biz-tabs" class="biz-tabs" aria-label="Dashboard sections"></nav>
      <section id="biz-content" class="biz"></section>
    </div>

    <!-- Fabric seller area: sellers run their market stall of fabrics -->
    <div id="seller-view" class="seller-view" hidden>
      <nav id="seller-tabs" class="biz-tabs" aria-label="Seller sections"></nav>
      <section id="seller-content" class="biz seller"></section>
    </div>
  </main>

  <footer class="footer">
    Your data is saved in this browser.
    <button class="link-button" onclick="resetSampleData()">Reset to sample data</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Scripts: data first, then the screens, then app.js starts everything -->
  <script src="js/data.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/sellers-data.js"></script>
  <script src="js/concept.js"></script>
  <script src="js/marketplace.js"></script>
  <script src="js/customer.js"></script>
  <script src="js/seller.js"></script>
  <script src="js/seller-fabrics.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/production.js"></script>
  <script src="js/team.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/measurements.js"></script>
  <script src="js/fabrics.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/weddings.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/deliveries.js"></script>
  <script src="js/invoices.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
