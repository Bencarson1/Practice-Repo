# Builds the public tailor pages (for Google) from the approved tailors in
# Supabase, then publishes the site to GitHub Pages.
#
# Runs every day, on every merge into main, and when you press
# "Run workflow" (Actions → Tailor pages → Run workflow).
#
# One-off setting: Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions". Optional: Settings → Secrets and variables → Actions →
# Variables → SITE_URL = https://nebedahub.com (the site's own domain; set in
# Settings → Pages → Custom domain).
#
# Only the PUBLISHABLE key is used (it's already public in wearvia/js/config.js).
# Never add the secret key here.

name: Tailor pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"      # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the tailor pages from Supabase
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://nebedahub.com' }}
        run: node scripts/build-tailor-pages.mjs

      - name: Put the site together
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://nebedahub.com' }}
        run: |
          mkdir -p _site
          # The app is the whole site: https://nebedahub.com/
          cp -R wearvia/. _site/
          rm -rf _site/supabase _site/README.md
          cp wearvia-prototype.html _site/ 2>/dev/null || true
          cp CNAME _site/CNAME 2>/dev/null || true
          # Old links (https://nebedahub.com/wearvia/…) go to their new addresses
          node scripts/old-address-redirects.mjs _site
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
