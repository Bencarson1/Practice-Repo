name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Block obvious secrets committed to the repository
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git             '(sk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[^"$]|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^"$]|SUPABASE_SECRET_KEY[[:space:]]*=[[:space:]]*[^"$])' .; then
            echo "Potential secret found in tracked files."
            exit 1
          fi

      - name: Real online payments need the server payment flow
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'ONLINE_PAYMENTS_ENABLED[[:space:]]*=[[:space:]]*true' wearvia/js/config.js; then
            # Payments may only be switched on with the server-side Stripe flow in place:
            # amounts from the database, a signature-checked webhook and the payout ledger.
            for f in wearvia/supabase/stripe-payments.sql \
                     wearvia/supabase/functions/stripe-checkout/index.ts \
                     wearvia/supabase/functions/stripe-webhook/index.ts \
                     wearvia/supabase/functions/stripe-settle/index.ts; do
              [ -f "$f" ] || { echo "ONLINE_PAYMENTS_ENABLED is true but $f is missing."; exit 1; }
            done
            grep -q 'verifySignature' wearvia/supabase/functions/stripe-webhook/index.ts \
              || { echo "The Stripe webhook must verify signatures."; exit 1; }
            grep -q 'wv_stripe_checkout_order' wearvia/supabase/functions/stripe-checkout/index.ts \
              || { echo "Checkout must take the amount from the database."; exit 1; }
            # The Paystack (naira) rail follows the same rules
            for f in wearvia/supabase/paystack-payments.sql \
                     wearvia/supabase/functions/paystack-checkout/index.ts \
                     wearvia/supabase/functions/paystack-webhook/index.ts \
                     wearvia/supabase/functions/paystack-settle/index.ts \
                     wearvia/supabase/functions/paystack-bank/index.ts; do
              [ -f "$f" ] || { echo "ONLINE_PAYMENTS_ENABLED is true but $f is missing."; exit 1; }
            done
            grep -q 'x-paystack-signature' wearvia/supabase/functions/paystack-webhook/index.ts \
              || { echo "The Paystack webhook must verify signatures."; exit 1; }
            grep -q 'transaction/verify' wearvia/supabase/functions/paystack-webhook/index.ts \
              || { echo "The Paystack webhook must re-check each charge with Paystack."; exit 1; }
            grep -q 'wv_stripe_checkout_order' wearvia/supabase/functions/paystack-checkout/index.ts \
              || { echo "Paystack checkout must take the amount from the database."; exit 1; }
          fi

      - name: Check public frontend does not reference service role keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'service[_-]?role|SUPABASE_SERVICE_ROLE_KEY' wearvia/js wearvia/*.html wearvia/admin wearvia/business wearvia/sellers 2>/dev/null; then
            echo "Service-role material must never be used by browser code."
            exit 1
          fi
